[workspace]
resolver = "2"
members = [
  "crates/hydra-core",
  "crates/hydra-grpc-client"
]

[workspace.package]
edition = "2024"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
