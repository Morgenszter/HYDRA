syntax = "proto3";

package hydra.voice.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Hydra.Contracts.Voice.V1";

service HydraVoiceService {
  // Legacy voice-intent surface kept for backward compatibility with existing clients.
  rpc GetVoiceState(GetVoiceStateRequest) returns (VoiceState);
  rpc StreamVoiceEvents(StreamVoiceEventsRequest) returns (stream VoiceEvent);
  rpc SubmitTranscript(SubmitTranscriptRequest) returns (VoiceIntentResult);

  // Voice profile management.
  rpc ListVoiceProfiles(ListVoiceProfilesRequest) returns (ListVoiceProfilesResponse);
  rpc GetVoiceProfile(GetVoiceProfileRequest) returns (GetVoiceProfileResponse);
  rpc UpsertVoiceProfile(UpsertVoiceProfileRequest) returns (UpsertVoiceProfileResponse);
  rpc DeleteVoiceProfile(DeleteVoiceProfileRequest) returns (DeleteVoiceProfileResponse);
  rpc SetDefaultVoiceProfile(SetDefaultVoiceProfileRequest) returns (SetDefaultVoiceProfileResponse);

  // Route selection and playback control.
  rpc ListVoiceRoutes(ListVoiceRoutesRequest) returns (ListVoiceRoutesResponse);
  rpc SelectVoiceRoute(SelectVoiceRouteRequest) returns (SelectVoiceRouteResponse);
  rpc SpeakText(SpeakTextRequest) returns (SpeakTextResponse);
  rpc PlayCue(PlayCueRequest) returns (PlayCueResponse);
  rpc StopPlayback(StopPlaybackRequest) returns (StopPlaybackResponse);

  // Operational status and health.
  rpc GetVoiceStatus(GetVoiceStatusRequest) returns (GetVoiceStatusResponse);
  rpc CheckVoiceHealth(CheckVoiceHealthRequest) returns (CheckVoiceHealthResponse);
}

message GetVoiceStateRequest {
  string client_id = 1;
}

message StreamVoiceEventsRequest {
  string client_id = 1;
}

message SubmitTranscriptRequest {
  string transcript = 1;
  string locale = 2;
  google.protobuf.Timestamp captured_at = 3;
}

message VoiceState {
  VoiceMode mode = 1;
  string active_profile = 2;
  string last_transcript = 3;
  string last_intent = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message VoiceEvent {
  string event_id = 1;
  VoiceEventType event_type = 2;
  string transcript = 3;
  string intent = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string request_id = 6;
  string playback_id = 7;
  VoicePlaybackState playback_state = 8;
  VoiceErrorCode error_code = 9;
  string message = 10;
  map<string, string> attributes = 11;
}

message VoiceIntentResult {
  string intent = 1;
  float confidence = 2;
  bool accepted = 3;
  string reason = 4;
}

message ListVoiceProfilesRequest {
  string request_id = 1;
  string client_id = 2;
  string locale = 3;
  bool include_disabled = 4;
}

message ListVoiceProfilesResponse {
  string request_id = 1;
  repeated VoiceProfile profiles = 2;
  string default_profile_id = 3;
  google.protobuf.Timestamp captured_at = 4;
}

message GetVoiceProfileRequest {
  string request_id = 1;
  string profile_id = 2;
}

message GetVoiceProfileResponse {
  string request_id = 1;
  VoiceProfile profile = 2;
}

message UpsertVoiceProfileRequest {
  string request_id = 1;
  VoiceProfile profile = 2;
  bool set_as_default = 3;
}

message UpsertVoiceProfileResponse {
  string request_id = 1;
  VoiceProfile profile = 2;
  VoiceMutationResult result = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message DeleteVoiceProfileRequest {
  string request_id = 1;
  string profile_id = 2;
}

message DeleteVoiceProfileResponse {
  string request_id = 1;
  string profile_id = 2;
  bool deleted = 3;
  google.protobuf.Timestamp deleted_at = 4;
}

message SetDefaultVoiceProfileRequest {
  string request_id = 1;
  string profile_id = 2;
}

message SetDefaultVoiceProfileResponse {
  string request_id = 1;
  string profile_id = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ListVoiceRoutesRequest {
  string request_id = 1;
  string client_id = 2;
  VoiceRouteIntent intent = 3;
  string preferred_zone = 4;
  bool include_unavailable = 5;
}

message ListVoiceRoutesResponse {
  string request_id = 1;
  repeated VoiceRoute routes = 2;
  string selected_route_id = 3;
  google.protobuf.Timestamp captured_at = 4;
}

message SelectVoiceRouteRequest {
  string request_id = 1;
  VoiceRouteSelection selection = 2;
  bool persist_as_default = 3;
}

message SelectVoiceRouteResponse {
  string request_id = 1;
  VoiceRoute selected_route = 2;
  google.protobuf.Timestamp selected_at = 3;
}

message SpeakTextRequest {
  string request_id = 1;
  string client_id = 2;
  string text = 3;
  string locale = 4;
  string profile_id = 5;
  VoiceRouteSelection route = 6;
  VoicePlaybackOptions playback = 7;
  SpeechSynthesisOptions synthesis = 8;
  map<string, string> metadata = 9;
}

message SpeakTextResponse {
  string request_id = 1;
  string playback_id = 2;
  VoicePlaybackState state = 3;
  VoiceRoute selected_route = 4;
  VoiceProfile resolved_profile = 5;
  google.protobuf.Timestamp accepted_at = 6;
  google.protobuf.Timestamp estimated_completion_at = 7;
}

message PlayCueRequest {
  string request_id = 1;
  string client_id = 2;
  string cue_id = 3;
  string profile_id = 4;
  VoiceRouteSelection route = 5;
  VoicePlaybackOptions playback = 6;
  map<string, string> metadata = 7;
}

message PlayCueResponse {
  string request_id = 1;
  string playback_id = 2;
  string cue_id = 3;
  VoicePlaybackState state = 4;
  VoiceRoute selected_route = 5;
  google.protobuf.Timestamp accepted_at = 6;
}

message StopPlaybackRequest {
  string request_id = 1;
  string client_id = 2;
  string playback_id = 3;
  VoiceRouteSelection route = 4;
  VoiceStopMode stop_mode = 5;
  string reason = 6;
}

message StopPlaybackResponse {
  string request_id = 1;
  string playback_id = 2;
  VoicePlaybackState state = 3;
  bool stopped = 4;
  google.protobuf.Timestamp stopped_at = 5;
}

message GetVoiceStatusRequest {
  string request_id = 1;
  string client_id = 2;
  bool include_routes = 3;
  bool include_profiles = 4;
}

message GetVoiceStatusResponse {
  string request_id = 1;
  VoiceServiceStatus status = 2;
}

message CheckVoiceHealthRequest {
  string request_id = 1;
  string client_id = 2;
}

message CheckVoiceHealthResponse {
  string request_id = 1;
  VoiceHealth health = 2;
  repeated VoiceHealthCheck checks = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message VoiceProfile {
  string profile_id = 1;
  string display_name = 2;
  VoiceProfileKind kind = 3;
  string locale = 4;
  bool enabled = 5;
  bool is_default = 6;
  OMEGONVoiceProfile omegon = 7;
  string dsp_preset_id = 8;
  SpeechSynthesisOptions default_synthesis = 9;
  VoicePlaybackOptions default_playback = 10;
  map<string, string> attributes = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message OMEGONVoiceProfile {
  string persona_id = 1;
  string voice_model_id = 2;
  string timbre = 3;
  string emotional_tone = 4;
  float stability = 5;
  float similarity_boost = 6;
  float style_exaggeration = 7;
  bool speaker_boost = 8;
  map<string, string> parameters = 9;
}

message SpeechSynthesisOptions {
  VoiceSynthesisProvider provider = 1;
  string model = 2;
  string voice_id = 3;
  float speaking_rate = 4;
  float pitch = 5;
  float volume_gain_db = 6;
  string audio_format = 7;
}

message VoicePlaybackOptions {
  VoicePriority priority = 1;
  bool interrupt_current = 2;
  bool duck_other_audio = 3;
  float volume = 4;
  int32 repeat_count = 5;
  int32 timeout_ms = 6;
}

message VoiceRouteSelection {
  string route_id = 1;
  string device_id = 2;
  string endpoint_id = 3;
  string zone = 4;
  VoiceRouteIntent intent = 5;
}

message VoiceRoute {
  string route_id = 1;
  string display_name = 2;
  VoiceRouteKind kind = 3;
  VoiceRouteIntent intent = 4;
  VoiceRouteAvailability availability = 5;
  VoiceDeviceTarget target = 6;
  int32 priority = 7;
  map<string, string> attributes = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message VoiceDeviceTarget {
  string device_id = 1;
  string endpoint_id = 2;
  string zone = 3;
  string driver = 4;
  string output_channel = 5;
  repeated string supported_formats = 6;
  map<string, string> routing_hints = 7;
}

message VoiceServiceStatus {
  VoiceHealth health = 1;
  VoiceMode mode = 2;
  VoicePlaybackState playback_state = 3;
  string active_profile_id = 4;
  string selected_route_id = 5;
  string current_playback_id = 6;
  repeated VoiceRoute routes = 7;
  repeated VoiceProfile profiles = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message VoiceHealthCheck {
  string component_id = 1;
  string display_name = 2;
  VoiceHealth health = 3;
  string message = 4;
  google.protobuf.Timestamp checked_at = 5;
}

enum VoiceMode {
  VOICE_MODE_UNSPECIFIED = 0;
  VOICE_MODE_DISABLED = 1;
  VOICE_MODE_PASSIVE = 2;
  VOICE_MODE_ARMED = 3;
  VOICE_MODE_PROCESSING = 4;
}

enum VoiceEventType {
  VOICE_EVENT_TYPE_UNSPECIFIED = 0;
  VOICE_EVENT_TYPE_TRANSCRIPT = 1;
  VOICE_EVENT_TYPE_INTENT = 2;
  VOICE_EVENT_TYPE_ERROR = 3;
  VOICE_EVENT_TYPE_STATE_CHANGED = 4;
  VOICE_EVENT_TYPE_PLAYBACK_STARTED = 5;
  VOICE_EVENT_TYPE_PLAYBACK_COMPLETED = 6;
  VOICE_EVENT_TYPE_PLAYBACK_STOPPED = 7;
  VOICE_EVENT_TYPE_ROUTE_CHANGED = 8;
  VOICE_EVENT_TYPE_PROFILE_CHANGED = 9;
}

enum VoiceProfileKind {
  VOICE_PROFILE_KIND_UNSPECIFIED = 0;
  VOICE_PROFILE_KIND_SYSTEM = 1;
  VOICE_PROFILE_KIND_USER = 2;
  VOICE_PROFILE_KIND_OMEGON = 3;
}

enum VoiceSynthesisProvider {
  VOICE_SYNTHESIS_PROVIDER_UNSPECIFIED = 0;
  VOICE_SYNTHESIS_PROVIDER_SYSTEM = 1;
  VOICE_SYNTHESIS_PROVIDER_OMEGON = 2;
  VOICE_SYNTHESIS_PROVIDER_EXTERNAL = 3;
}

enum VoiceRouteKind {
  VOICE_ROUTE_KIND_UNSPECIFIED = 0;
  VOICE_ROUTE_KIND_LOCAL_DEVICE = 1;
  VOICE_ROUTE_KIND_REMOTE_DEVICE = 2;
  VOICE_ROUTE_KIND_GROUP = 3;
  VOICE_ROUTE_KIND_VIRTUAL = 4;
}

enum VoiceRouteIntent {
  VOICE_ROUTE_INTENT_UNSPECIFIED = 0;
  VOICE_ROUTE_INTENT_ASSISTANT = 1;
  VOICE_ROUTE_INTENT_NOTIFICATION = 2;
  VOICE_ROUTE_INTENT_ALERT = 3;
  VOICE_ROUTE_INTENT_CUE = 4;
}

enum VoiceRouteAvailability {
  VOICE_ROUTE_AVAILABILITY_UNSPECIFIED = 0;
  VOICE_ROUTE_AVAILABILITY_AVAILABLE = 1;
  VOICE_ROUTE_AVAILABILITY_BUSY = 2;
  VOICE_ROUTE_AVAILABILITY_UNAVAILABLE = 3;
  VOICE_ROUTE_AVAILABILITY_DISABLED = 4;
}

enum VoicePlaybackState {
  VOICE_PLAYBACK_STATE_UNSPECIFIED = 0;
  VOICE_PLAYBACK_STATE_QUEUED = 1;
  VOICE_PLAYBACK_STATE_PLAYING = 2;
  VOICE_PLAYBACK_STATE_PAUSED = 3;
  VOICE_PLAYBACK_STATE_COMPLETED = 4;
  VOICE_PLAYBACK_STATE_STOPPED = 5;
  VOICE_PLAYBACK_STATE_FAILED = 6;
}

enum VoicePriority {
  VOICE_PRIORITY_UNSPECIFIED = 0;
  VOICE_PRIORITY_LOW = 1;
  VOICE_PRIORITY_NORMAL = 2;
  VOICE_PRIORITY_HIGH = 3;
  VOICE_PRIORITY_CRITICAL = 4;
}

enum VoiceStopMode {
  VOICE_STOP_MODE_UNSPECIFIED = 0;
  VOICE_STOP_MODE_CURRENT = 1;
  VOICE_STOP_MODE_ROUTE = 2;
  VOICE_STOP_MODE_ALL = 3;
}

enum VoiceMutationResult {
  VOICE_MUTATION_RESULT_UNSPECIFIED = 0;
  VOICE_MUTATION_RESULT_CREATED = 1;
  VOICE_MUTATION_RESULT_UPDATED = 2;
  VOICE_MUTATION_RESULT_UNCHANGED = 3;
}

enum VoiceHealth {
  VOICE_HEALTH_UNSPECIFIED = 0;
  VOICE_HEALTH_READY = 1;
  VOICE_HEALTH_DEGRADED = 2;
  VOICE_HEALTH_CRITICAL = 3;
  VOICE_HEALTH_OFFLINE = 4;
}

// Error-to-gRPC status mapping for HydraVoiceService implementations:
// - VOICE_ERROR_CODE_INVALID_REQUEST -> INVALID_ARGUMENT
// - VOICE_ERROR_CODE_PROFILE_NOT_FOUND -> NOT_FOUND
// - VOICE_ERROR_CODE_ROUTE_NOT_FOUND -> NOT_FOUND
// - VOICE_ERROR_CODE_ROUTE_UNAVAILABLE -> UNAVAILABLE
// - VOICE_ERROR_CODE_SYNTHESIS_FAILED -> INTERNAL
// - VOICE_ERROR_CODE_PLAYBACK_FAILED -> INTERNAL
// - VOICE_ERROR_CODE_PLAYBACK_NOT_FOUND -> NOT_FOUND
// - VOICE_ERROR_CODE_CANCELLED -> CANCELLED
// - VOICE_ERROR_CODE_INTERNAL -> INTERNAL
// Transport failures must be returned as gRPC status errors. Successful RPC
// responses must echo request_id and may also include VoiceErrorCode in events.
enum VoiceErrorCode {
  VOICE_ERROR_CODE_UNSPECIFIED = 0;
  VOICE_ERROR_CODE_INVALID_REQUEST = 1;
  VOICE_ERROR_CODE_PROFILE_NOT_FOUND = 2;
  VOICE_ERROR_CODE_ROUTE_NOT_FOUND = 3;
  VOICE_ERROR_CODE_ROUTE_UNAVAILABLE = 4;
  VOICE_ERROR_CODE_SYNTHESIS_FAILED = 5;
  VOICE_ERROR_CODE_PLAYBACK_FAILED = 6;
  VOICE_ERROR_CODE_PLAYBACK_NOT_FOUND = 7;
  VOICE_ERROR_CODE_CANCELLED = 8;
  VOICE_ERROR_CODE_INTERNAL = 9;
}